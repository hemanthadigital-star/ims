<style>
:root{--bg:#f1f8f4;--cd:#fff;--tx:#16241c;--mu:#5f7468;--bd:#dcebe2;--pr:#15803d;--g:linear-gradient(135deg,#14532d,#16a34a);--ok:#15803d;--bad:#d64545;--okb:#dcfce7;--bb:#fde8e8;--sh:0 4px 18px #16a34a1a;color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1511;--cd:#13231b;--tx:#e6f4ec;--mu:#93ad9f;--bd:#1f3a2c;--pr:#4ade80;--g:linear-gradient(135deg,#064e3b,#15803d);--ok:#4ade80;--bad:#ff8a8a;--okb:#10381f;--bb:#40201f;--sh:none;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1511;--cd:#13231b;--tx:#e6f4ec;--mu:#93ad9f;--bd:#1f3a2c;--pr:#4ade80;--g:linear-gradient(135deg,#064e3b,#15803d);--ok:#4ade80;--bad:#ff8a8a;--okb:#10381f;--bb:#40201f;--sh:none;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Poppins","Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;background:var(--g);color:#fff;box-shadow:0 4px 20px #0003}
header button{background:#ffffff26;color:#fff;border:1px solid #ffffff40;min-height:40px;padding:4px 12px}
h1{font-size:20px;margin:0}h2{font-size:18px;margin:0 0 10px}h3{font-size:14px;margin:12px 0 6px;color:var(--mu)}
nav{display:flex;gap:6px;padding:12px 20px;overflow-x:auto}nav button{flex:1;min-width:120px;display:flex;align-items:center;justify-content:center;gap:6px}
main{padding:0 20px 30px;max-width:1150px;margin:auto}
button{font:inherit;min-height:44px;padding:6px 16px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);cursor:pointer}
button.on{background:var(--g);color:#fff;border:0;font-weight:600}button.pri{background:var(--g);color:#fff;border:0;font-weight:600;box-shadow:0 4px 12px #16a34a40}
button.del{color:var(--bad);min-height:40px;padding:2px 12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-top:14px;box-shadow:var(--sh);overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:block;font-size:14px;color:var(--mu)}
input,select{font:inherit;width:100%;min-height:44px;padding:6px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input:focus,select:focus{outline:2px solid var(--pr);outline-offset:1px}input[readonly]{font-weight:700;color:var(--pr)}
table{width:100%;border-collapse:collapse;margin-top:8px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mu);font-size:13px}
.sc{border-left:5px solid var(--pr)}.sc:nth-child(2n){border-left-color:#0d9488}.sc:nth-child(3n){border-left-color:#65a30d}.stat{font-size:28px;font-weight:700;color:var(--pr)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}.ar{border-bottom:1px solid var(--bd);padding:8px 0}
.pd,.pill{background:var(--okb);color:var(--ok);border-color:var(--ok);font-weight:600}.np{background:var(--bb);color:var(--bad);border-color:var(--bad)}
.pill{border-radius:99px;padding:2px 14px}.bad{color:var(--bad)}.ok{color:var(--ok);font-weight:700}.ft{text-align:center;color:var(--mu);font-size:13px;margin:24px 0 0}
.ban{background:var(--okb);color:var(--ok);font-weight:600}.lgo{width:40px;height:40px;border-radius:50%;object-fit:contain;background:#fff;vertical-align:middle}.lg .lgo{width:110px;height:110px}.pt .lgo{width:64px;height:64px}.pt{display:none;align-items:center;gap:12px;border-bottom:2px solid #000;padding:8px 0;margin-bottom:8px}
.lg{min-height:100vh;display:grid;place-items:center;background:var(--g);padding:20px}.lg .card{max-width:380px;width:100%;text-align:center;margin:0}
@media(max-width:720px){main{padding:0 12px 96px}nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:var(--cd);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));gap:2px;box-shadow:0 -4px 16px #0002}nav button{flex-direction:column;min-width:0;min-height:52px;padding:2px;border:0;font-size:11px;gap:0;background:transparent;box-shadow:none}nav button.on{background:transparent;color:var(--pr)}nav button span{font-size:20px}h1{font-size:16px}}
@media print{.pt{display:flex}header,nav,button,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:0;padding:0;box-shadow:none}}
