<style>

label{display:block;font-size:14px;color:var(--mu)}

.lg{min-height:100vh;display:grid;place-items:center;background:var(--g);padding:20px}.lg .card{max-width:380px;width:100%;text-align:center;margin:0}

@media print{.pt{display:flex}header,nav,button,.noprint{display:none!important}body{background:#fff;color:#000}.card{border:0;padding:0;box-shadow:none}}
